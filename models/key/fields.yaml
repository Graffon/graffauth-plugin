tabs:
    fields:
        app_key:
            label: 'App Token'
            span: full
            type: text
            tab: Credentials
        api_key:
            label: 'API key'
            span: full
            readOnly: 1
            type: sensitive
            tab: Credentials
fields:
    is_active:
        label: 'Active API key'
        span: full
        default: 0
        type: switch
        comment: 'By activating the API key it will accept requests'
    name:
        label: 'App Name'
        span: full
        type: text
    origins:
        label: 'Allowed Origins'
        mode: string
        separator: comma
        customTags: true
        useKey: false
        span: full
        type: taglist
        commentAbove: 'To enable Origin-based access restrictions, please list the authorized Origins.'
    is_origins_active:
        label: 'Active Origin Protection'
        span: full
        type: switch
        comment: 'By activating Origin-based access restrictions will be enabled'
    ip_address:
        label: 'Allowed IP Addresses'
        mode: string
        separator: comma
        options:
            - 0.0.0.0
        customTags: true
        useKey: false
        span: full
        type: taglist
        commentAbove: 'To enable IP-based access restrictions, please list the authorized IP addresses. you can use "0.0.0.0" IP for open access'
    is_ip_active:
        label: 'Active IP Protection'
        span: full
        type: switch
        comment: 'By activating IP-based access restrictions will be enabled'
    apps:
        label: 'App Names'
        mode: string
        separator: comma
        customTags: true
        useKey: false
        span: full
        type: taglist
        commentAbove: 'To enable App-based-protection access restrictions, please list the authorized App Names.'
    is_app_protect_active:
        label: 'App Protection Enable'
        span: auto
        type: switch
        comment: 'By activating App-based access restrictions will be enabled'
